<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="favicon.svg" sizes="any" />
    <script>
      (function () {
        function assetPath(path) {
          const base = document.querySelector('base');
          let prefix = base ? base.getAttribute('href') || '/' : '/';

          if (!prefix.endsWith('/')) {
            prefix += '/';
          }

          return prefix + path.replace(/^\//, '');
        }

        const mode = localStorage.getItem('site-theme-mode') || 'system';
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = mode === 'system' ? (isDark ? 'dark' : 'light') : mode;

        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;

        const favicon = document.getElementById('app-favicon');

        if (favicon) {
          favicon.href = assetPath(theme === 'dark' ? 'favicon-dark.svg' : 'favicon.svg');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Professional portfolio for Rowan Smith featuring experience, resume highlights, and selected projects."
    />
    <title>Rowan Smith</title>
    <script>
      // Restore path saved by 404.html redirect (GitHub Pages SPA support)
      (function () {
        const redirect = sessionStorage.getItem('redirect');

        if (redirect) {
          sessionStorage.removeItem('redirect');
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
